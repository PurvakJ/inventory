<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Inventory Management System | Advanced Tabs</title>
<style>/* Inventory Management System - Enhanced Premium Stylesheet */
    /* Elegant Sage Green & Cream Palette with Modern Touches */
    
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap');
    
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    body {
        font-family: 'Poppins', 'Playfair Display', serif;
        background: linear-gradient(135deg, #F2EDE4 0%, #E8E0D4 100%);
        overflow-x: hidden;
        min-height: 100vh;
    }
    
    /* ==================== COLOR VARIABLES ==================== */
    :root {
        --orthiva-sage: #9BB875;
        --orthiva-sage-light: #C2DF8E;
        --orthiva-sage-dark: #7A9B58;
        --orthiva-cream: #F2EDE4;
        --orthiva-cream-light: #F9F7F2;
        --orthiva-cream-dark: #E0D8CA;
        --orthiva-blue: #3A7BD5;
        --orthiva-wa: #25D366;
        --orthiva-navy: #1A2C3C;
        --orthiva-text-dark: #2C3E2F;
        --orthiva-text-light: #6B7B6B;
        --white: #FFFFFF;
        --gold: #D4AF37;
        --gold-light: #E8C84A;
        --red: #E74C3C;
        --red-light: #FF6B6B;
        --green: #27AE60;
        --green-light: #58D68D;
        --orange: #F39C12;
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 5px 20px rgba(0, 0, 0, 0.08);
        --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.12);
        --shadow-xl: 0 20px 40px rgba(0, 0, 0, 0.15);
        --shadow-2xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        --transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        --transition-fast: all 0.2s ease;
    }
    
    /* ==================== CONTAINER ==================== */
    .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 24px;
    }
    
    /* ==================== LOGIN SCREEN ==================== */
    .login-screen {
        max-width: 420px;
        margin: 100px auto;
        animation: fadeInUp 0.6s ease-out;
    }
    
    .login-screen .card {
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(155, 184, 117, 0.2);
    }
    
    /* ==================== CARDS ==================== */
    .card {
        background: var(--white);
        padding: 28px;
        border-radius: 28px;
        margin-bottom: 24px;
        box-shadow: var(--shadow-md);
        transition: var(--transition);
        border: 1px solid rgba(155, 184, 117, 0.1);
        position: relative;
        overflow: hidden;
    }
    
    .card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, var(--orthiva-sage), var(--orthiva-sage-light), var(--orthiva-sage));
        transform: scaleX(0);
        transition: transform 0.4s ease;
    }
    
    .card:hover::before {
        transform: scaleX(1);
    }
    
    .card:hover {
        box-shadow: var(--shadow-xl);
        transform: translateY(-4px);
        border-color: rgba(155, 184, 117, 0.2);
    }
    
    /* ==================== TABS STYLES ==================== */
    .tabs-container {
        background: var(--white);
        border-radius: 28px;
        margin-bottom: 24px;
        overflow: hidden;
        box-shadow: var(--shadow-md);
    }
    
    .tabs-header {
        display: flex;
        background: var(--orthiva-cream-light);
        border-bottom: 2px solid var(--orthiva-cream-dark);
        gap: 4px;
        padding: 8px 16px 0 16px;
    }
    
    .tab-btn {
        background: transparent;
        padding: 14px 28px;
        border-radius: 60px 60px 0 0;
        font-weight: 600;
        font-size: 15px;
        letter-spacing: 0.5px;
        color: var(--orthiva-text-light);
        cursor: pointer;
        transition: var(--transition-fast);
        width: auto;
        box-shadow: none;
        position: relative;
    }
    
    .tab-btn::before {
        display: none;
    }
    
    .tab-btn:hover {
        background: rgba(155, 184, 117, 0.1);
        transform: translateY(-2px);
        color: var(--orthiva-text-dark);
    }
    
    .tab-btn.active {
        background: var(--white);
        color: var(--orthiva-sage-dark);
        border-bottom: 3px solid var(--orthiva-sage);
    }
    
    .tab-pane {
        display: none;
        padding: 24px;
        animation: fadeInUp 0.4s ease-out;
    }
    
    .tab-pane.active {
        display: block;
    }
    
    /* ==================== GRID SYSTEM ==================== */
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
        align-items: end;
    }
    
    .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 24px;
    }
    
    /* ==================== STAT BOXES ==================== */
    .stat-box {
        background: linear-gradient(135deg, var(--white) 0%, var(--orthiva-cream-light) 100%);
        padding: 24px;
        border-radius: 24px;
        box-shadow: var(--shadow-sm);
        text-align: center;
        border-left: 4px solid var(--orthiva-sage);
        transition: var(--transition);
        position: relative;
        overflow: hidden;
    }
    
    .stat-box::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--orthiva-sage), transparent);
        transform: translateX(-100%);
        transition: transform 0.6s ease;
    }
    
    .stat-box:hover::after {
        transform: translateX(0);
    }
    
    .stat-box:hover {
        transform: translateY(-6px);
        box-shadow: var(--shadow-lg);
    }
    
    .stat-box div {
        color: var(--orthiva-text-light);
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 10px;
    }
    
    .stat-box h2 {
        font-size: 36px;
        margin: 0;
        color: var(--orthiva-text-dark);
        font-family: 'Playfair Display', serif;
        font-weight: 700;
        background: linear-gradient(135deg, var(--orthiva-text-dark), var(--orthiva-sage-dark));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }
    
    /* ==================== FORM ELEMENTS ==================== */
    input, select, button {
        width: 100%;
        padding: 12px 18px;
        border-radius: 60px;
        border: 2px solid var(--orthiva-cream-dark);
        background: var(--white);
        font-size: 14px;
        transition: var(--transition-fast);
        outline: none;
        font-family: 'Poppins', sans-serif;
    }
    
    input:hover, select:hover {
        border-color: var(--orthiva-sage-light);
    }
    
    input:focus, select:focus {
        border-color: var(--orthiva-sage);
        box-shadow: 0 0 0 4px rgba(155, 184, 117, 0.15);
        transform: translateY(-1px);
    }
    
    button {
        background: linear-gradient(135deg, var(--orthiva-sage), var(--orthiva-sage-dark));
        color: var(--orthiva-text-dark);
        border: none;
        cursor: pointer;
        font-weight: 600;
        letter-spacing: 0.5px;
        position: relative;
        overflow: hidden;
    }
    
    button::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        transform: translate(-50%, -50%);
        transition: width 0.6s, height 0.6s;
    }
    
    button:hover::before {
        width: 300px;
        height: 300px;
    }
    
    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(155, 184, 117, 0.4);
    }
    
    button:active {
        transform: translateY(0);
    }
    
    /* ==================== TABLES & SCROLL ==================== */
    .table-wrapper {
        overflow-x: auto;
        max-height: 500px;
        overflow-y: auto;
        border-radius: 20px;
        border: 1px solid var(--orthiva-cream-dark);
    }
    
    .products-table-scroll {
        max-height: 450px;
        overflow-y: auto;
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
    }
    
    th, td {
        padding: 14px 16px;
        border-bottom: 1px solid var(--orthiva-cream-dark);
        text-align: left;
        vertical-align: middle;
    }
    
    th {
        background: linear-gradient(135deg, var(--orthiva-sage), var(--orthiva-sage-dark));
        color: var(--orthiva-text-dark);
        font-weight: 600;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
        position: sticky;
        top: 0;
        z-index: 10;
    }
    
    td {
        color: var(--orthiva-text-light);
        font-size: 14px;
        transition: var(--transition-fast);
    }
    
    tr {
        transition: var(--transition-fast);
    }
    
    tr:hover {
        background: var(--orthiva-cream-light);
    }
    
    /* ==================== STATUS BADGES ==================== */
    .low, .critical, .normal {
        font-weight: 600;
        border-radius: 50px;
        padding: 5px 14px;
        display: inline-block;
        font-size: 11px;
        letter-spacing: 0.5px;
        transition: var(--transition-fast);
    }
    
    .low {
        color: var(--orange);
        background: linear-gradient(135deg, rgba(243, 156, 18, 0.1), rgba(243, 156, 18, 0.05));
        border-left: 2px solid var(--orange);
    }
    
    .critical {
        color: var(--red);
        background: linear-gradient(135deg, rgba(231, 76, 60, 0.1), rgba(231, 76, 60, 0.05));
        border-left: 2px solid var(--red);
    }
    
    .normal {
        color: var(--green);
        background: linear-gradient(135deg, rgba(39, 174, 96, 0.1), rgba(39, 174, 96, 0.05));
        border-left: 2px solid var(--green);
    }
    
    /* ==================== ACTION BUTTONS ==================== */
    .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }
    
    .actions button {
        padding: 6px 14px;
        font-size: 11px;
        font-weight: 600;
        background: linear-gradient(135deg, var(--orthiva-cream-dark), var(--orthiva-cream));
        color: var(--orthiva-text-dark);
        width: auto;
        box-shadow: var(--shadow-sm);
    }
    
    .actions button:hover {
        background: linear-gradient(135deg, var(--orthiva-sage), var(--orthiva-sage-dark));
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(155, 184, 117, 0.3);
    }
    
    /* ==================== TOP BAR ==================== */
    .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 28px;
        flex-wrap: wrap;
        gap: 16px;
        animation: slideInLeft 0.5s ease-out;
    }
    
    .topbar h1 {
        font-size: 32px;
        font-weight: 800;
        color: var(--orthiva-text-dark);
        font-family: 'Playfair Display', serif;
        background: linear-gradient(135deg, var(--orthiva-text-dark), var(--orthiva-sage-dark));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -0.5px;
    }
    
    .role-badge {
        padding: 8px 22px;
        border-radius: 60px;
        background: linear-gradient(135deg, var(--orthiva-sage), var(--orthiva-sage-dark));
        color: var(--orthiva-text-dark);
        font-weight: 700;
        font-size: 13px;
        display: inline-block;
        box-shadow: var(--shadow-sm);
        letter-spacing: 1px;
    }
    
    /* ==================== TRANSACTION BOX ==================== */
    .transaction-box {
        max-height: 500px;
        overflow-y: auto;
        border-radius: 20px;
        border: 1px solid var(--orthiva-cream-dark);
    }
    
    .transaction-box::-webkit-scrollbar, .table-wrapper::-webkit-scrollbar {
        width: 8px;
    }
    
    .transaction-box::-webkit-scrollbar-track, .table-wrapper::-webkit-scrollbar-track {
        background: var(--orthiva-cream-dark);
        border-radius: 10px;
    }
    
    .transaction-box::-webkit-scrollbar-thumb, .table-wrapper::-webkit-scrollbar-thumb {
        background: linear-gradient(135deg, var(--orthiva-sage), var(--orthiva-sage-dark));
        border-radius: 10px;
    }
    
    /* ==================== FILTER BAR ==================== */
    .filter-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 20px;
        align-items: center;
        background: linear-gradient(135deg, var(--orthiva-cream-light), var(--white));
        padding: 16px 24px;
        border-radius: 80px;
        box-shadow: var(--shadow-sm);
        border: 1px solid rgba(155, 184, 117, 0.15);
    }
    
    .filter-bar input, .filter-bar select {
        width: auto;
        min-width: 160px;
        margin: 0;
        background: var(--white);
    }
    
    .filter-bar button {
        width: auto;
        padding: 10px 26px;
        background: linear-gradient(135deg, var(--orthiva-sage-dark), var(--orthiva-sage));
    }
    
    .filter-bar button.reset-btn {
        background: linear-gradient(135deg, var(--orthiva-text-light), var(--orthiva-text-dark));
    }
    
    .filter-bar button.reset-btn:hover {
        background: linear-gradient(135deg, var(--orthiva-text-dark), var(--orthiva-text-dark));
    }
    
    /* ==================== HEADINGS ==================== */
    h1, h2, h3 {
        margin-bottom: 16px;
        font-weight: 700;
        color: var(--orthiva-text-dark);
        font-family: 'Playfair Display', serif;
    }
    
    h2 {
        font-size: 24px;
        display: flex;
        align-items: center;
        gap: 10px;
        letter-spacing: -0.3px;
    }
    
    h2::before {
        content: '';
        width: 4px;
        height: 24px;
        background: linear-gradient(135deg, var(--orthiva-sage), var(--orthiva-sage-dark));
        border-radius: 4px;
    }
    
    /* ==================== HIDE CLASS ==================== */
    .hidden {
        display: none;
    }
    
    /* ==================== ANIMATIONS ==================== */
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(40px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    @keyframes slideInLeft {
        from {
            opacity: 0;
            transform: translateX(-30px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }
    
    .card, .stat-box, .filter-bar {
        animation: fadeInUp 0.5s ease-out;
    }
    
    /* ==================== RESPONSIVE ==================== */
    @media (max-width: 768px) {
        .container { padding: 0 16px; }
        .topbar { flex-direction: column; text-align: center; }
        .grid, .stats { grid-template-columns: 1fr; }
        .filter-bar { flex-direction: column; border-radius: 28px; }
        .filter-bar input, .filter-bar select, .filter-bar button { width: 100%; }
        th, td { padding: 10px 12px; font-size: 12px; }
        .actions { flex-direction: column; }
        .actions button { width: 100%; }
        .card { padding: 20px; }
        .topbar h1 { font-size: 26px; }
        .tab-btn { padding: 10px 16px; font-size: 13px; }
        .tab-pane { padding: 16px; }
    }
    
    @media (max-width: 480px) {
        .login-screen { margin: 60px 20px; }
        .card { padding: 16px; }
        .stat-box h2 { font-size: 24px; }
        .tab-btn { padding: 8px 12px; font-size: 12px; }
    }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login-screen">
    <div class="card">
        <h1>📦 Inventory Login</h1>
        <input type="password" id="adminPassword" placeholder="Enter Admin Password">
        <br><br>
        <button onclick="loginAdmin()">🔐 Login As Admin</button>
        <br><br>
        <button onclick="loginViewer()">👁️ Enter As Viewer</button>
    </div>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden">
    <div class="container">
        <div class="topbar">
            <h1>📊 Inventory Management</h1>
            <div>
                <span class="role-badge" id="roleText"></span>
                <button onclick="logout()" style="width:auto;padding:8px 18px;margin-left:12px;">🚪 Logout</button>
            </div>
        </div>


        <!-- ADD PRODUCT SECTION (outside tabs for easy access) -->
        <div class="card" id="adminPanel">
            <h2>➕ Add New Product</h2>
            <div class="grid">
                <input type="text" id="name" placeholder="Product Name *">
                <input type="text" id="size" placeholder="Size (e.g., L, XL, 10m)">
                <select id="unitTypeSelect">
                    <option value="Pcs">📦 Pcs</option>
                    <option value="Meter">📏 Meter</option>
                    <option value="Kg">⚖️ Kg</option>
                    <option value="Bundle">📚 Bundle</option>
                </select>
                <input type="number" id="quantity" placeholder="Quantity" value="0">
                <input type="number" id="minStock" placeholder="Min Stock Threshold" value="5">
            </div>
            <br>
            <button onclick="addProductHandler()">➕ Add Product</button>
        </div>

                <!-- STATS DASHBOARD -->
                <div class="stats" id="stats"></div>

        <!-- TABS SECTION -->
        <div class="tabs-container">
            <div class="tabs-header">
                <button class="tab-btn active" onclick="switchTab('productsTab')">📦 All Products</button>
                <button class="tab-btn" onclick="switchTab('transactionsTab')">📜 Transaction History</button>
            </div>
            
            <!-- Products Tab -->
            <div id="productsTab" class="tab-pane active">
                <div class="filter-bar">
                    <input type="text" id="searchNameInput" placeholder="🔍 Search by name..." autocomplete="off">
                    <select id="filterUnitSelect">
                        <option value="all">📌 All Units</option>
                        <option value="Pcs">Pcs</option>
                        <option value="Meter">Meter</option>
                        <option value="Kg">Kg</option>
                        <option value="Bundle">Bundle</option>
                    </select>
                    <select id="filterStatusSelect">
                        <option value="all">🏷️ All Status</option>
                        <option value="normal">✅ Normal</option>
                        <option value="low">⚠️ Low Stock</option>
                        <option value="critical">🔥 Critical</option>
                    </select>
                    <button class="reset-btn" onclick="resetAllFilters()">⟳ Reset Filters</button>
                </div>
                <div class="table-wrapper products-table-scroll">
                    <table>
                        <thead>
                            <tr><th>Name</th><th>Size</th><th>Unit</th><th>Quantity</th><th>Min Stock</th><th>Status</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="productTable"></tbody>
                    </table>
                </div>
            </div>
            
            <!-- Transactions Tab -->
            <div id="transactionsTab" class="tab-pane">
                <h3 style="margin-bottom: 16px;">📋 Complete Transaction Log</h3>
                <div class="transaction-box">
                    <table>
                        <thead>
                            <tr><th>Product</th><th>Type</th><th>Qty</th><th>Previous</th><th>New</th><th>Date</th></tr>
                        </thead>
                        <tbody id="transactionTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Configuration
const API_URL = "https://script.google.com/macros/s/AKfycbybZXQt8wUQjFuevaIUGPPUiUpkjOqOUMasdOFNg2xTi6qzySVa88EATdIst1MYhij4vg/exec";
const ADMIN_PASSWORD = "admin123";
let MODE = "viewer";
let searchDebounceTimer = null;

// Tab switching
function switchTab(tabId) {
    document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    if(tabId === 'productsTab') {
        event.target.classList.add('active');
    } else {
        const btns = document.querySelectorAll('.tab-btn');
        btns[1].classList.add('active');
    }
    // Re-render to ensure proper display
    renderProducts();
    renderTransactions();
}

// Login functions
function loginAdmin() {
    const password = document.getElementById("adminPassword").value;
    if(password !== ADMIN_PASSWORD) { alert("❌ Wrong Password"); return; }
    MODE = "admin";
    startApp();
}
function loginViewer() { MODE = "viewer"; startApp(); }
function logout() { location.reload(); }

function startApp() {
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("roleText").innerText = MODE.toUpperCase();
    if(MODE === "viewer") {
        document.getElementById("adminPanel").style.display = "none";
    } else {
        document.getElementById("adminPanel").style.display = "block";
    }
    attachFilterListeners();
    InventoryDB.init();
}

// Database Handler
const InventoryDB = {
    memory: { products: [], transactions: [] },
    async init() {
        if(MODE === "admin") {
            this.loadLocal();
            this.ensureUnitTypeMigration();
            await this.fullRender();
            await this.syncToCloud();
        } else {
            await this.loadFromCloud();
            this.ensureUnitTypeMigration();
            await this.fullRender();
        }
    },
    ensureUnitTypeMigration() {
        let changed = false;
        this.memory.products.forEach(p => {
            if(!p.unitType || p.unitType === "") { p.unitType = "Pcs"; changed = true; }
        });
        if(changed && MODE === "admin") this.saveLocal();
    },
    loadLocal() {
        const products = localStorage.getItem("products");
        const transactions = localStorage.getItem("transactions");
        this.memory.products = products ? JSON.parse(products) : [];
        this.memory.transactions = transactions ? JSON.parse(transactions) : [];
        if(!Array.isArray(this.memory.transactions)) this.memory.transactions = [];
        if(!Array.isArray(this.memory.products)) this.memory.products = [];
    },
    saveLocal() {
        localStorage.setItem("products", JSON.stringify(this.memory.products));
        localStorage.setItem("transactions", JSON.stringify(this.memory.transactions));
    },
    async loadFromCloud() {
        try {
            const productsResponse = await fetch(`${API_URL}?action=getProducts`);
            const transactionsResponse = await fetch(`${API_URL}?action=getTransactions&limit=200`);
            this.memory.products = await productsResponse.json();
            this.memory.transactions = await transactionsResponse.json();
            if(!Array.isArray(this.memory.products)) this.memory.products = [];
            if(!Array.isArray(this.memory.transactions)) this.memory.transactions = [];
        } catch(e) { console.warn("Cloud fallback", e); this.loadLocal(); }
    },
    async syncToCloud() {
        if(MODE !== "admin") return;
        try {
            await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "syncAll", data: { products: this.memory.products, transactions: this.memory.transactions } }) });
        } catch(error) { console.error("sync error", error); }
    },
    async fullRender() { renderProducts(); renderTransactions(); renderStats(); },
    addTransaction(transaction) {
        this.memory.transactions.unshift(transaction);
        if(this.memory.transactions.length > 500) this.memory.transactions = this.memory.transactions.slice(0, 500);
        if(MODE === "admin") this.saveLocal();
    }
};

setInterval(async () => { if(MODE === "admin") await InventoryDB.syncToCloud(); }, 12000);

function generateId() { return crypto.randomUUID(); }
function getStatus(qty, min) { if(qty === 0) return "critical"; if(qty <= min) return "low"; return "normal"; }

// Add Product
function addProductHandler() {
    if(MODE !== "admin") return;
    const name = document.getElementById("name").value.trim();
    const size = document.getElementById("size").value.trim();
    const unitType = document.getElementById("unitTypeSelect").value;
    let quantity = Number(document.getElementById("quantity").value);
    let minStock = Number(document.getElementById("minStock").value);
    if(!name) { alert("⚠️ Product Name required"); return; }
    if(isNaN(quantity)) quantity = 0;
    if(isNaN(minStock)) minStock = 5;
    const newProduct = { id: generateId(), name, size: size || "Standard", unitType, quantity, minStock, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
    InventoryDB.memory.products.unshift(newProduct);
    InventoryDB.addTransaction({ id: generateId(), productId: newProduct.id, productName: newProduct.name, type: "initial", quantity: newProduct.quantity, previousStock: 0, newStock: newProduct.quantity, date: new Date().toLocaleString() });
    if(MODE === "admin") InventoryDB.saveLocal();
    clearAddProductForm();
    renderProducts(); renderTransactions(); renderStats();
}
function clearAddProductForm() {
    document.getElementById("name").value = "";
    document.getElementById("size").value = "";
    document.getElementById("unitTypeSelect").value = "Pcs";
    document.getElementById("quantity").value = "";
    document.getElementById("minStock").value = "";
}

// Stock operations
function changeStock(id, action) {
    if(MODE !== "admin") return;
    const product = InventoryDB.memory.products.find(p => p.id === id);
    if(!product) return;
    const qty = Number(prompt(`Enter quantity to ${action === "add" ? "ADD" : "REMOVE"}:`));
    if(isNaN(qty) || qty <= 0) return;
    const previous = product.quantity;
    if(action === "add") product.quantity += qty;
    else { if(qty > product.quantity) { alert("❌ Insufficient Stock"); return; } product.quantity -= qty; }
    product.updatedAt = new Date().toISOString();
    InventoryDB.addTransaction({ id: generateId(), productId: product.id, productName: product.name, type: action === "add" ? "add_stock" : "remove_stock", quantity: qty, previousStock: previous, newStock: product.quantity, date: new Date().toLocaleString() });
    if(MODE === "admin") InventoryDB.saveLocal();
    renderProducts(); renderTransactions(); renderStats();
}
function editProduct(id) {
    if(MODE !== "admin") return;
    const product = InventoryDB.memory.products.find(p => p.id === id);
    if(!product) return;
    const newName = prompt("Edit Product Name:", product.name);
    if(!newName || newName.trim() === "") return;
    const newQty = Number(prompt("New Quantity:", product.quantity));
    const newMin = Number(prompt("Minimum Stock Level:", product.minStock));
    if(isNaN(newQty) || isNaN(newMin)) return;
    const previous = product.quantity;
    product.name = newName.trim(); product.quantity = newQty; product.minStock = newMin; product.updatedAt = new Date().toISOString();
    InventoryDB.addTransaction({ id: generateId(), productId: product.id, productName: product.name, type: "manual_update", quantity: Math.abs(previous - newQty), previousStock: previous, newStock: newQty, date: new Date().toLocaleString() });
    if(MODE === "admin") InventoryDB.saveLocal();
    renderProducts(); renderTransactions(); renderStats();
}
function deleteProduct(id) {
    if(MODE !== "admin") return;
    if(!confirm("⚠️ Permanently delete product?")) return;
    InventoryDB.memory.products = InventoryDB.memory.products.filter(p => p.id !== id);
    if(MODE === "admin") InventoryDB.saveLocal();
    renderProducts(); renderStats();
}

// Filtering
function getFilteredProducts() {
    let products = [...InventoryDB.memory.products];
    const searchTerm = document.getElementById("searchNameInput")?.value.trim().toLowerCase() || "";
    const unitFilter = document.getElementById("filterUnitSelect")?.value || "all";
    const statusFilter = document.getElementById("filterStatusSelect")?.value || "all";
    if(searchTerm) products = products.filter(p => p.name.toLowerCase().includes(searchTerm));
    if(unitFilter !== "all") products = products.filter(p => p.unitType === unitFilter);
    if(statusFilter !== "all") products = products.filter(p => getStatus(p.quantity, p.minStock) === statusFilter);
    return products;
}
function renderProducts() {
    const filtered = getFilteredProducts();
    const tbody = document.getElementById("productTable");
    if(!tbody) return;
    tbody.innerHTML = "";
    if(filtered.length === 0) { tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:40px;">✨ No products match ✨</td></tr>`; return; }
    filtered.forEach(product => {
        const status = getStatus(product.quantity, product.minStock);
        let statusClass = status === "low" ? "low" : status === "critical" ? "critical" : "normal";
        const actionButtons = (MODE === "admin") ? `<div class="actions"><button onclick="changeStock('${product.id}','add')">➕ +</button><button onclick="changeStock('${product.id}','remove')">➖ -</button><button onclick="editProduct('${product.id}')">✏️ Edit</button><button onclick="deleteProduct('${product.id}')">🗑️ Del</button></div>` : `<span>🔍 View Only</span>`;
        tbody.innerHTML += `<tr><td><strong>${escapeHtml(product.name)}</strong></td><td>${escapeHtml(product.size)}</td><td>${escapeHtml(product.unitType)}</td><td>${product.quantity}</td><td>${product.minStock}</td><td><span class="${statusClass}">${status.toUpperCase()}</span></td><td>${actionButtons}</td></tr>`;
    });
}
function renderTransactions() {
    const tbody = document.getElementById("transactionTable");
    if(!tbody) return;
    tbody.innerHTML = "";
    const transactions = InventoryDB.memory.transactions;
    if(!transactions || transactions.length === 0) { tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:32px;">📭 No transactions yet</td></tr>`; return; }
    transactions.slice(0, 200).forEach(t => {
        tbody.innerHTML += `<tr><td>${escapeHtml(t.productName || "Unknown")}</td><td>${escapeHtml(t.type || "event")}</td><td>${t.quantity || 0}</td><td>${t.previousStock || 0}</td><td>${t.newStock || 0}</td><td style="font-size:12px;">${escapeHtml(t.date || new Date().toLocaleString())}</td></tr>`;
    });
}
function renderStats() {
    const products = InventoryDB.memory.products;
    let totalStock = 0, lowStock = 0, critical = 0;
    products.forEach(p => { totalStock += p.quantity; if(p.quantity <= p.minStock) lowStock++; if(p.quantity === 0) critical++; });
    document.getElementById("stats").innerHTML = `<div class="stat-box"><div>📦 Total Products</div><h2>${products.length}</h2></div><div class="stat-box"><div>📊 Total Stock</div><h2>${totalStock}</h2></div><div class="stat-box"><div>⚠️ Low Stock</div><h2>${lowStock}</h2></div><div class="stat-box"><div>🔥 Critical</div><h2>${critical}</h2></div>`;
}
function escapeHtml(str) { if(!str) return ""; return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }
function attachFilterListeners() {
    const searchInput = document.getElementById("searchNameInput");
    const unitSelect = document.getElementById("filterUnitSelect");
    const statusSelect = document.getElementById("filterStatusSelect");
    const refresh = () => renderProducts();
    if(searchInput) searchInput.addEventListener("input", () => { if(searchDebounceTimer) clearTimeout(searchDebounceTimer); searchDebounceTimer = setTimeout(refresh, 280); });
    if(unitSelect) unitSelect.addEventListener("change", refresh);
    if(statusSelect) statusSelect.addEventListener("change", refresh);
}
function resetAllFilters() {
    const searchInput = document.getElementById("searchNameInput");
    const unitSelect = document.getElementById("filterUnitSelect");
    const statusSelect = document.getElementById("filterStatusSelect");
    if(searchInput) searchInput.value = "";
    if(unitSelect) unitSelect.value = "all";
    if(statusSelect) statusSelect.value = "all";
    renderProducts();
}
window.changeStock = changeStock; window.editProduct = editProduct; window.deleteProduct = deleteProduct; window.addProductHandler = addProductHandler; window.resetAllFilters = resetAllFilters; window.loginAdmin = loginAdmin; window.loginViewer = loginViewer; window.logout = logout; window.switchTab = switchTab;
</script>
</body>
</html>
