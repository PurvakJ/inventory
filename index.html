<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lightning Stock | Instant Inventory + PDF Export</title>
<!-- Include jsPDF and autoTable for clean PDF generation -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>

/* =========================================
   GLOBAL RESET & VARIABLES
========================================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
}

body {
    background: #f0f4f9;
    overflow-x: hidden;
}

button {
    cursor: pointer;
    transition: all 0.2s ease;
}

/* Toast notification */
.toast {
    position: fixed;
    bottom: 100px;
    right: 30px;
    background: #1e293b;
    color: white;
    padding: 12px 24px;
    border-radius: 60px;
    font-size: 14px;
    z-index: 3000;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.2s ease;
    pointer-events: none;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}
.toast.show {
    opacity: 1;
    transform: translateY(0);
}
.toast.success { background: #15803d; }
.toast.error { background: #b91c1c; }

/* =========================================
   LOGIN PAGE - GLASS EFFECT
========================================= */
#loginPage {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0f2b4d 0%, #1b4a6e 100%);
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 400px;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(2px);
    padding: 40px 32px;
    border-radius: 32px;
    box-shadow: 0 25px 45px rgba(0,0,0,0.2), 0 0 0 1px rgba(255,255,255,0.2);
    text-align: center;
}

.login-box h2 {
    margin-bottom: 28px;
    color: #0a2540;
    font-weight: 700;
    letter-spacing: -0.3px;
}

.login-box input {
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 18px;
    border: 1.5px solid #e2e8f0;
    border-radius: 60px;
    font-size: 15px;
    background: #fefefe;
    transition: 0.2s;
}

.login-box input:focus {
    border-color: #2c7da0;
    outline: none;
    box-shadow: 0 0 0 3px rgba(44,125,160,0.2);
}

.login-box button {
    width: 100%;
    padding: 14px;
    background: #1f6392;
    border: none;
    color: white;
    border-radius: 60px;
    font-size: 16px;
    font-weight: 600;
    box-shadow: 0 5px 12px rgba(0,0,0,0.1);
}

.login-box button:hover {
    background: #0f4c72;
    transform: scale(0.98);
}

/* =========================================
   APP CONTAINER
========================================= */
#app {
    display: none;
}

.layout {
    display: flex;
    min-height: 100vh;
}

/* =========================================
   SIDEBAR (ELEGANT DARK)
========================================= */
.sidebar {
    width: 270px;
    background: #0f172a;
    color: #eef2ff;
    padding: 28px 18px;
    transition: 0.25s;
    z-index: 110;
    backdrop-filter: blur(2px);
}

.sidebar h2 {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 40px;
    letter-spacing: -0.5px;
    background: linear-gradient(120deg, #b9e0ff, #ffffff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.menu-btn {
    width: 100%;
    padding: 14px 18px;
    margin-bottom: 14px;
    border: none;
    border-radius: 60px;
    background: #1e293b;
    color: #f1f5f9;
    text-align: left;
    font-size: 15px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 12px;
}

.menu-btn:hover {
    background: #2c3e66;
    transform: translateX(5px);
}

.logout-btn {
    background: #b91c1c;
    margin-top: 20px;
}

/* PDF BUTTON style enhancements */
.pdf-export-btn {
    background: #dc2626;
    color: white;
    border: none;
    padding: 8px 18px;
    border-radius: 40px;
    font-weight: 600;
    font-size: 0.8rem;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}
.pdf-export-btn:hover {
    background: #b91c1c;
    transform: scale(0.96);
}

/* =========================================
   MAIN AREA
========================================= */
.main {
    flex: 1;
    padding: 24px 28px;
    overflow-x: auto;
    background: #f8fafc;
}

/* topbar */
.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 12px;
}

.topbar h1 {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, #0f2b3d, #1e5a7a);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

/* page toggle */
.page {
    display: none;
}
.active-page {
    display: block;
}

/* =========================================
   CARDS (dashboard + filter cards)
========================================= */
.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 24px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 20px 24px;
    border-radius: 28px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 6px rgba(0,0,0,0.05);
    border: 1px solid rgba(0,0,0,0.03);
    transition: 0.2s;
}

.card h3 {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #475569;
    margin-bottom: 12px;
}

.card h1 {
    font-size: 40px;
    font-weight: 800;
    color: #1e4a6e;
}

/* FILTERS */
.filters {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-top: 8px;
}

.filter-row {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
}

.filter-row .filters {
    flex: 1;
    margin-top: 0;
}

.clear-btn {
    background: #e2e8f0;
    color: #1e293b;
    border: none;
    padding: 12px 24px;
    border-radius: 60px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
    white-space: nowrap;
}

.clear-btn:hover {
    background: #cbd5e1;
    transform: scale(0.96);
}

input, select {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #cbd5e1;
    border-radius: 60px;
    font-size: 14px;
    background: white;
}

/* PRODUCT CARD GRID */
.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

.product-card {
    background: #ffffff;
    border-radius: 28px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    transition: all 0.2s;
    border: 1px solid #eef2ff;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    animation: fadeInUp 0.2s ease;
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.product-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 30px -12px rgba(0,0,0,0.1);
}

.product-info {
    padding: 20px 20px 12px 20px;
    flex: 1;
}

.product-title {
    font-size: 1.3rem;
    font-weight: 700;
    color: #0f172a;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
}

.product-category {
    font-size: 0.75rem;
    background: #e6f0fa;
    padding: 4px 12px;
    border-radius: 60px;
    color: #1f6392;
    font-weight: 600;
}

.product-details {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin: 12px 0;
    font-size: 0.85rem;
    color: #334155;
}

.detail-badge {
    background: #f1f5f9;
    padding: 5px 10px;
    border-radius: 40px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.stock-info {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed #e2e8f0;
}

.stock-value {
    font-size: 1.6rem;
    font-weight: 800;
}

.low-stock-warning {
    color: #b91c1c;
    background: #fee2e2;
    padding: 4px 10px;
    border-radius: 40px;
    font-size: 0.7rem;
    font-weight: bold;
}

.action-bar {
    display: flex;
    gap: 10px;
    padding: 14px 20px 20px 20px;
    background: #fefefe;
    border-top: 1px solid #ecf3fa;
    flex-wrap: wrap;
    justify-content: space-between;
}

.action-btn {
    border: none;
    padding: 9px 16px;
    border-radius: 60px;
    font-weight: 600;
    font-size: 0.8rem;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: 0.15s;
}

.action-btn:active {
    transform: scale(0.95);
}

.btn-green {
    background: #eafaf1;
    color: #15803d;
}
.btn-green:hover { background: #dcfce7; }

.btn-red {
    background: #fee2e2;
    color: #b91c1c;
}
.btn-red:hover { background: #fecaca; }

.btn-orange {
    background: #fff1e6;
    color: #c2410c;
}
.btn-orange:hover { background: #ffedd5; }

.btn-dark {
    background: #eef2ff;
    color: #1e293b;
}

.loading-badge {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid #cbd5e1;
    border-top-color: #1f6392;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    margin-left: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* MODAL */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    visibility: hidden;
    opacity: 0;
    transition: 0.2s;
}

.modal-overlay.active {
    visibility: visible;
    opacity: 1;
}

.modal-container {
    background: white;
    width: 90%;
    max-width: 620px;
    border-radius: 36px;
    padding: 28px 30px;
    box-shadow: 0 40px 60px rgba(0,0,0,0.3);
}

.modal-form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 14px;
    margin-top: 28px;
}

.modal-save {
    background: #1f6392;
    color: white;
    padding: 12px 28px;
    border-radius: 50px;
    font-weight: bold;
}

.modal-cancel {
    background: #e2e8f0;
    padding: 12px 24px;
    border-radius: 50px;
}

.floating-add-btn {
    position: fixed;
    bottom: 28px;
    right: 28px;
    width: 62px;
    height: 62px;
    border-radius: 62px;
    background: #1f6392;
    color: white;
    border: none;
    box-shadow: 0 12px 20px rgba(0,0,0,0.25);
    font-size: 30px;
    font-weight: bold;
    z-index: 1050;
    transition: all 0.2s;
}

.floating-add-btn:hover {
    background: #0f4c72;
    transform: scale(1.08);
}

.mobile-top {
    display: none;
    background: #0f172a;
    color: white;
    padding: 16px 20px;
    justify-content: space-between;
    align-items: center;
}

.mobile-top button {
    background: #2c7da0;
    border: none;
    padding: 8px 20px;
    border-radius: 30px;
    color: white;
}

@media (max-width: 780px) {
    .sidebar {
        position: fixed;
        left: -280px;
        top: 0;
        height: 100%;
        z-index: 1200;
        width: 260px;
    }
    .sidebar.active { left: 0; }
    .mobile-top { display: flex; }
    .main { padding: 16px; }
    .product-grid { grid-template-columns: 1fr; gap: 18px; }
    .modal-form-grid { grid-template-columns: 1fr; }
    .cards { grid-template-columns: 1fr; }
    .filters { grid-template-columns: 1fr; }
    .filter-row { flex-direction: column; }
    .clear-btn { width: 100%; text-align: center; }
}

.table-wrapper { overflow-x: auto; border-radius: 24px; }
table { width: 100%; border-collapse: collapse; background: white; border-radius: 20px; }
th { background: #1e293b; color: white; padding: 12px; }
td { padding: 10px; border-bottom: 1px solid #eef2ff; text-align: left; }

/* PDF button inside topbar */
.topbar-right { display: flex; gap: 12px; }
</style>
</head>
<body>

<div id="loginPage">
    <div class="login-box">
        <h2>⚡ Lightning Stock</h2>
        <input type="text" id="username" placeholder="Username" autocomplete="off">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Instant Access →</button>
    </div>
</div>

<div id="app">
    <div class="toast" id="toastMsg"></div>
    <div class="mobile-top">
        <h2>⚡ STOCK</h2>
        <button onclick="toggleSidebar()">☰ Menu</button>
    </div>
    <div class="layout">
        <div class="sidebar" id="sidebar">
            <h2>⚡ FAST</h2>
            <button class="menu-btn" onclick="showPage('dashboardPage')">📊 Dashboard</button>
            <button class="menu-btn" onclick="showPage('productsPage')">📦 Products</button>
            <button class="menu-btn" onclick="showPage('auditPage')">📜 Audit</button>
            <button class="menu-btn" onclick="changePassword()">🔐 Change Password</button>
            <button class="menu-btn logout-btn" onclick="logout()">🚪 Logout</button>
        </div>

        <div class="main">
            <!-- Dashboard page with export PDF button (summary not needed but for consistency) -->
            <div id="dashboardPage" class="page active-page">
                <div class="topbar"><h1>Dashboard</h1><div class="topbar-right"></div></div>
                <div class="cards">
                    <div class="card"><h3>Total Products</h3><h1 id="totalProducts">0</h1></div>
                    <div class="card"><h3>Total Stock (units)</h3><h1 id="totalStock">0</h1></div>
                    <div class="card"><h3>⚠️ Low Stock Items</h3><h1 id="lowStock">0</h1></div>
                </div>
            </div>

            <!-- PRODUCTS PAGE with PDF export button -->
            <div id="productsPage" class="page">
                <div class="topbar">
                    <h1>🛒 Products</h1>
                    <div class="topbar-right">
                        <button class="pdf-export-btn" onclick="exportProductsToPDF()">📄 Export Products PDF</button>
                    </div>
                </div>
                <div class="card">
                    <h2>🔍 Filters</h2>
                    <div class="filter-row">
                        <div class="filters">
                            <input type="text" id="filterBrand" placeholder="Brand" onkeyup="applyFilters()">
                            <input type="text" id="filterProduct" placeholder="Product name" onkeyup="applyFilters()">
                            <select id="filterCategory" onchange="applyFilters()">
                                <option value="">All Categories</option>
                                <option>Mattress</option><option>Office Chair</option><option>Plastic Chair</option><option>Cloth</option><option>Foam</option>
                            </select>
                            <select id="filterType" onchange="applyFilters()">
                                <option value="">All Units</option><option>pcs</option><option>meter</option><option>bundle</option><option>kg</option>
                            </select>
                        </div>
                        <button class="clear-btn" onclick="clearProductFilters()">🗑 Clear Filters</button>
                    </div>
                </div>
                <div id="productGridContainer" class="product-grid"></div>
            </div>

            <!-- AUDIT PAGE with PDF export button -->
            <div id="auditPage" class="page">
                <div class="topbar">
                    <h1>Audit Logs</h1>
                    <div class="topbar-right">
                        <button class="pdf-export-btn" onclick="exportAuditToPDF()">📄 Export Audit PDF</button>
                    </div>
                </div>
                <div class="card">
                    <h2>Filter entries</h2>
                    <div class="filter-row">
                        <div class="filters">
                            <input type="text" id="auditActionFilter" placeholder="Action (ADD/REDUCE/EDIT)" onkeyup="applyAuditFilters()">
                            <input type="text" id="auditProductFilter" placeholder="Product name" onkeyup="applyAuditFilters()">
                            <input type="date" id="auditDateFilter" onchange="applyAuditFilters()">
                        </div>
                        <button class="clear-btn" onclick="clearAuditFilters()">🗑 Clear Filters</button>
                    </div>
                </div>
                <div class="card">
                    <div class="table-wrapper">
                        <table>
                            <thead><tr><th>Action</th><th>Product</th><th>Qty</th><th>Details</th><th>Date</th></tr></thead>
                            <tbody id="auditTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <button class="floating-add-btn" onclick="openProductDialog()">+</button>
    
    <div id="productModal" class="modal-overlay">
        <div class="modal-container">
            <h3 id="modalTitle">Add Product</h3>
            <div class="modal-form-grid">
                <select id="modalCategory"><option value="">Category</option><option>Mattress</option><option>Office Chair</option><option>Plastic Chair</option><option>Cloth</option><option>Foam</option></select>
                <input type="text" id="modalBrand" placeholder="Brand">
                <input type="text" id="modalProductName" placeholder="Product Name">
                <input type="text" id="modalSize" placeholder="Size (optional)">
                <select id="modalQuantityType"><option value="">Units</option><option>pcs</option><option>meter</option><option>bundle</option><option>kg</option></select>
                <input type="number" id="modalPresentStock" placeholder="Stock">
                <input type="number" id="modalMinimumStock" placeholder="Min Stock">
            </div>
            <div class="modal-actions"><button class="modal-cancel" onclick="closeModal()">Cancel</button><button class="modal-save" onclick="saveProductFromModal()">Save</button></div>
        </div>
    </div>
</div>

<script>
const { jsPDF } = window.jspdf;

const API_URL = "https://script.google.com/macros/s/AKfycbwkKzINTIdLJEaADVNCPSp63VaKVZ97xuSjSe7NExzct8wn9RRafoLS3jWVsdzNL-Swuw/exec";

let products = [], filteredProducts = [], audits = [], filteredAudits = [];
let editingProductId = null;
let pendingSync = new Set();

function showToast(msg, type = 'success') {
    const toast = document.getElementById('toastMsg');
    toast.textContent = msg;
    toast.className = `toast ${type} show`;
    setTimeout(() => toast.classList.remove('show'), 2000);
}

async function api(action, data = {}, silent = false) {
    try {
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action, ...data }) });
        return await res.json();
    } catch (err) {
        if (!silent) showToast(`Sync error: ${err.message}`, 'error');
        return { success: false, error: err.message };
    }
}

function updateDashboardUI() {
    let totalStock = 0, low = 0;
    products.forEach(p => { totalStock += Number(p.presentStock); if (Number(p.presentStock) <= Number(p.minimumStock)) low++; });
    document.getElementById("totalProducts").innerText = products.length;
    document.getElementById("totalStock").innerText = totalStock;
    document.getElementById("lowStock").innerText = low;
}

function renderProductsGrid() {
    const container = document.getElementById("productGridContainer");
    if (!container) return;
    if (filteredProducts.length === 0) { container.innerHTML = `<div class="card" style="text-align:center;">✨ No products match filters</div>`; return; }
    container.innerHTML = filteredProducts.map(prod => {
        const isLow = Number(prod.presentStock) <= Number(prod.minimumStock);
        const isSyncing = pendingSync.has(prod.id);
        return `
        <div class="product-card" data-product-id="${prod.id}">
            <div class="product-info">
                <div class="product-title">
                    <span>${escapeHtml(prod.productName)}</span>
                    <span class="product-category">${escapeHtml(prod.category)}</span>
                </div>
                <div class="product-details">
                    <span class="detail-badge">🏷️ ${escapeHtml(prod.brand)}</span>
                    <span class="detail-badge">📏 ${escapeHtml(prod.size) || 'N/A'}</span>
                    <span class="detail-badge">📦 ${escapeHtml(prod.quantityType)}</span>
                </div>
                <div class="stock-info">
                    <div><span style="font-size:0.8rem;">Current stock</span><br><span class="stock-value">${prod.presentStock}</span> <span style="font-size:0.8rem;">${prod.quantityType}</span></div>
                    <div><span style="font-size:0.8rem;">Min threshold</span><br><strong>${prod.minimumStock}</strong></div>
                    ${isLow ? '<div class="low-stock-warning">⚠️ LOW STOCK</div>' : ''}
                </div>
            </div>
            <div class="action-bar">
                <button class="action-btn btn-green" onclick="addStockInstant('${prod.id}')">➕ Add</button>
                <button class="action-btn btn-red" onclick="reduceStockInstant('${prod.id}')">➖ Reduce</button>
                <button class="action-btn btn-orange" onclick="editProduct('${prod.id}')">✏️ Edit</button>
                <button class="action-btn btn-dark" onclick="deleteProductInstant('${prod.id}')">🗑 Delete</button>
                ${isSyncing ? '<span class="loading-badge"></span>' : ''}
            </div>
        </div>`;
    }).join('');
}

function applyFilters() {
    const category = document.getElementById("filterCategory")?.value.toLowerCase() || "";
    const brand = document.getElementById("filterBrand")?.value.toLowerCase() || "";
    const product = document.getElementById("filterProduct")?.value.toLowerCase() || "";
    const type = document.getElementById("filterType")?.value.toLowerCase() || "";
    filteredProducts = products.filter(p => 
        p.category.toLowerCase().includes(category) &&
        p.brand.toLowerCase().includes(brand) &&
        p.productName.toLowerCase().includes(product) &&
        p.quantityType.toLowerCase().includes(type)
    );
    renderProductsGrid();
}

function clearProductFilters() {
    document.getElementById("filterBrand").value = "";
    document.getElementById("filterProduct").value = "";
    document.getElementById("filterCategory").value = "";
    document.getElementById("filterType").value = "";
    applyFilters();
    showToast("Product filters cleared", "success");
}

function clearAuditFilters() {
    document.getElementById("auditActionFilter").value = "";
    document.getElementById("auditProductFilter").value = "";
    document.getElementById("auditDateFilter").value = "";
    applyAuditFilters();
    showToast("Audit filters cleared", "success");
}

// PDF Export: Products (based on current filtered view)
window.exportProductsToPDF = function() {
    const dataToExport = filteredProducts.length ? filteredProducts : products;
    if (!dataToExport.length) { showToast("No products to export", "error"); return; }
    const doc = new jsPDF({ orientation: 'landscape' });
    doc.setFontSize(18);
    doc.text("Lightning Stock - Products Report", 14, 15);
    doc.setFontSize(10);
    doc.text(`Generated: ${new Date().toLocaleString()}`, 14, 25);
    
    const tableData = dataToExport.map(p => [
        p.productName, p.category, p.brand, p.size || '—', p.quantityType, p.presentStock, p.minimumStock, (Number(p.presentStock) <= Number(p.minimumStock) ? "⚠️ Low" : "OK")
    ]);
    doc.autoTable({
        head: [["Product", "Category", "Brand", "Size", "Unit", "Current Stock", "Min Stock", "Status"]],
        body: tableData,
        startY: 32,
        theme: 'striped',
        headStyles: { fillColor: [31, 99, 146], textColor: 255, fontSize: 9 },
        bodyStyles: { fontSize: 8 },
        margin: { left: 10, right: 10 }
    });
    doc.save(`products_${new Date().toISOString().slice(0,19)}.pdf`);
    showToast("Products PDF downloaded", "success");
};

// PDF Export: Audit logs (based on current filtered audits)
window.exportAuditToPDF = function() {
    const dataToExport = filteredAudits.length ? filteredAudits : audits;
    if (!dataToExport.length) { showToast("No audit entries to export", "error"); return; }
    const doc = new jsPDF({ orientation: 'landscape' });
    doc.setFontSize(18);
    doc.text("Lightning Stock - Audit Logs", 14, 15);
    doc.setFontSize(10);
    doc.text(`Generated: ${new Date().toLocaleString()}`, 14, 25);
    
    const tableData = dataToExport.map(a => [
        a.action, a.productName, a.quantity || '-', a.details || '-', a.date
    ]);
    doc.autoTable({
        head: [["Action", "Product", "Quantity", "Details", "Date & Time"]],
        body: tableData,
        startY: 32,
        theme: 'striped',
        headStyles: { fillColor: [31, 99, 146], textColor: 255, fontSize: 9 },
        bodyStyles: { fontSize: 8 },
        margin: { left: 10, right: 10 }
    });
    doc.save(`audit_${new Date().toISOString().slice(0,19)}.pdf`);
    showToast("Audit PDF downloaded", "success");
};

async function addStockInstant(id) {
    let qty = prompt("➕ Enter quantity to add:");
    if (!qty || isNaN(qty) || Number(qty) <= 0) return;
    const product = products.find(p => p.id == id);
    if (!product) return;
    product.presentStock = Number(product.presentStock) + Number(qty);
    applyFilters();
    updateDashboardUI();
    showToast(`+${qty} added to ${product.productName}`, 'success');
    pendingSync.add(id);
    renderProductsGrid();
    await api("addStock", { id, quantity: qty }, true);
    pendingSync.delete(id);
    renderProductsGrid();
    await loadAuditSilent();
}

async function reduceStockInstant(id) {
    let qty = prompt("➖ Enter quantity to reduce:");
    if (!qty || isNaN(qty) || Number(qty) <= 0) return;
    const product = products.find(p => p.id == id);
    if (!product) return;
    if (Number(product.presentStock) < Number(qty)) {
        showToast("Insufficient stock!", 'error');
        return;
    }
    product.presentStock = Number(product.presentStock) - Number(qty);
    applyFilters();
    updateDashboardUI();
    showToast(`-${qty} reduced from ${product.productName}`, 'success');
    pendingSync.add(id);
    renderProductsGrid();
    await api("reduceStock", { id, quantity: qty }, true);
    pendingSync.delete(id);
    renderProductsGrid();
    await loadAuditSilent();
}

async function deleteProductInstant(id) {
    if (!confirm("⚠️ Delete product? Instant UI removal.")) return;
    const product = products.find(p => p.id == id);
    const productName = product ? product.productName : 'Product';
    products = products.filter(p => p.id != id);
    filteredProducts = filteredProducts.filter(p => p.id != id);
    applyFilters();
    updateDashboardUI();
    showToast(`🗑 Deleted ${productName}`, 'success');
    await api("deleteProduct", { id }, true);
    await loadAuditSilent();
}

function openProductDialog() { editingProductId = null; document.getElementById("modalTitle").innerText = "Add New Product"; clearModalFields(); document.getElementById("productModal").classList.add("active"); }
function closeModal() { document.getElementById("productModal").classList.remove("active"); editingProductId = null; }
function clearModalFields() {
    document.getElementById("modalCategory").value = "";
    document.getElementById("modalBrand").value = "";
    document.getElementById("modalProductName").value = "";
    document.getElementById("modalSize").value = "";
    document.getElementById("modalQuantityType").value = "";
    document.getElementById("modalPresentStock").value = "";
    document.getElementById("modalMinimumStock").value = "";
}

function editProduct(id) {
    const product = products.find(p => p.id == id);
    if (!product) return;
    editingProductId = id;
    document.getElementById("modalTitle").innerText = "Edit Product";
    document.getElementById("modalCategory").value = product.category || "";
    document.getElementById("modalBrand").value = product.brand || "";
    document.getElementById("modalProductName").value = product.productName || "";
    document.getElementById("modalSize").value = product.size || "";
    document.getElementById("modalQuantityType").value = product.quantityType || "";
    document.getElementById("modalPresentStock").value = product.presentStock;
    document.getElementById("modalMinimumStock").value = product.minimumStock;
    document.getElementById("productModal").classList.add("active");
}

async function saveProductFromModal() {
    const category = document.getElementById("modalCategory").value.trim();
    const brand = document.getElementById("modalBrand").value.trim();
    const productName = document.getElementById("modalProductName").value.trim();
    const size = document.getElementById("modalSize").value.trim();
    const quantityType = document.getElementById("modalQuantityType").value.trim();
    const presentStock = Number(document.getElementById("modalPresentStock").value);
    const minimumStock = Number(document.getElementById("modalMinimumStock").value);
    if (!category || !brand || !productName || !quantityType || isNaN(presentStock) || isNaN(minimumStock)) {
        showToast("Please fill all required fields", 'error');
        return;
    }
    
    if (editingProductId !== null) {
        const index = products.findIndex(p => p.id == editingProductId);
        if (index !== -1) {
            const updated = { ...products[index], category, brand, productName, size, quantityType, presentStock, minimumStock };
            products[index] = updated;
            filteredProducts = [...products];
            applyFilters();
            updateDashboardUI();
            showToast(`✏️ Updated ${productName}`, 'success');
            closeModal();
            await api("editProduct", updated, true);
            await loadAuditSilent();
        }
    } else {
        const newProduct = { id: Date.now(), category, brand, productName, size, quantityType, presentStock, minimumStock, createdAt: new Date() };
        products.unshift(newProduct);
        filteredProducts = [...products];
        applyFilters();
        updateDashboardUI();
        showToast(`✨ Added ${productName} instantly!`, 'success');
        closeModal();
        await api("addProduct", newProduct, true);
        await loadAuditSilent();
    }
}

async function loadAuditSilent() {
    const res = await api("getAudit", {}, true);
    if (res.success && res.audit) { audits = res.audit; filteredAudits = [...audits]; renderAudit(); }
}

async function login() {
    const username = document.getElementById("username").value, password = document.getElementById("password").value;
    const res = await api("login", { username, password });
    if (res.success) {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("app").style.display = "block";
        await loadProducts(); 
        await loadAuditSilent();
    } else alert("Invalid Credentials");
}

async function loadProducts() {
    const res = await api("getProducts");
    if (res.success) { products = res.products || []; filteredProducts = [...products]; renderProductsGrid(); updateDashboardUI(); }
}

function toggleSidebar() { document.getElementById("sidebar").classList.toggle("active"); }
function showPage(pageId) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active-page"));
    document.getElementById(pageId).classList.add("active-page");
    if (window.innerWidth < 900) document.getElementById("sidebar").classList.remove("active");
}

function renderAudit() {
    const tbody = document.getElementById("auditTable");
    tbody.innerHTML = filteredAudits.slice().reverse().map(a => `
        <tr>
            <td>${escapeHtml(a.action)}</td><td>${escapeHtml(a.productName)}</td><td>${a.quantity || '-'}</td><td>${escapeHtml(a.details || '')}</td><td>${a.date}</td>
        </tr>
    `).join('');
}

function applyAuditFilters() {
    const action = document.getElementById("auditActionFilter")?.value.toLowerCase() || "";
    const product = document.getElementById("auditProductFilter")?.value.toLowerCase() || "";
    const date = document.getElementById("auditDateFilter")?.value || "";
    filteredAudits = audits.filter(a => {
        const auditDate = new Date(a.date).toISOString().split("T")[0];
        return a.action.toLowerCase().includes(action) && a.productName.toLowerCase().includes(product) && (date === "" || auditDate === date);
    });
    renderAudit();
}

async function changePassword() { let pwd = prompt("Enter new password:"); if (pwd) { await api("changePassword", { password: pwd }); showToast("Password changed", 'success'); } }
function logout() { location.reload(); }
function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '&gt;': '&gt;' }[m])); }

window.applyFilters = applyFilters;
window.clearProductFilters = clearProductFilters;
window.clearAuditFilters = clearAuditFilters;
window.addStockInstant = addStockInstant;
window.reduceStockInstant = reduceStockInstant;
window.deleteProductInstant = deleteProductInstant;
window.editProduct = editProduct;
window.openProductDialog = openProductDialog;
window.saveProductFromModal = saveProductFromModal;
window.closeModal = closeModal;
window.toggleSidebar = toggleSidebar;
window.showPage = showPage;
window.changePassword = changePassword;
window.logout = logout;
window.exportProductsToPDF = exportProductsToPDF;
window.exportAuditToPDF = exportAuditToPDF;
</script>
</body>
</html>
